# Checks that run before every commit. One-time setup per clone:
#   uv run pre-commit install
# Each hook runs through `uv run`, so it uses the exact tool versions in uv.lock
# (the same ones CI and every teammate use) instead of separate copies.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false # checks the whole project (files are set in pyproject.toml)

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false # runs the full test suite
