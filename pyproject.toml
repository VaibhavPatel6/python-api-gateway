[project]
name = "python-api-gateway"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: common bugs,
# UP: modern syntax, ASYNC: blocking calls inside async functions.
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
strict = true
files = ["gateway", "upstreams", "tests"]
